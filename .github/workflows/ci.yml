name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests & static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the musl target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - name: Run unit and integration tests
        run: cargo test --locked
      - name: Build the static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Check the binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/pulso-server
          if readelf -lW "$bin" | grep -q INTERP; then
            echo "$bin asks for a dynamic loader" >&2
            exit 1
          fi
          ldd "$bin" 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
      - name: Run the integration tests against the static binary
        run: >
          PULSO_TEST_BIN="$PWD/target/x86_64-unknown-linux-musl/release/pulso-server"
          cargo test --locked --test server

  app:
    name: App build & unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, devs in devices.items() if "iOS" in runtime
                   for d in devs if d["isAvailable"] and d["name"].startswith("iPhone")]
          print(sorted(names)[-1])')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      # Signed ad-hoc ("Sign to Run Locally") rather than unsigned, so the
      # test host carries the HealthKit entitlement and the read-set probe
      # exercises HealthKit's real validation.
      - name: Build and test
        env:
          SIMULATOR: ${{ steps.sim.outputs.name }}
        run: |
          status=0
          xcodebuild test \
            -project Pulso.xcodeproj \
            -scheme Pulso \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            > test.log 2>&1 || status=$?
          grep -E '(error:|PULSO-|Test Case .* failed|Executed [0-9]+ tests|\*\* TEST)' test.log | head -200 || true
          if [ "$status" -ne 0 ]; then
            tail -80 test.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-log
          path: test.log
          if-no-files-found: ignore
